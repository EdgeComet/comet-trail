<!doctype html>
<!-- data-theme="dark" opts into the dark palette; remove it for the light theme. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CometTrail</title>
  <link rel="stylesheet" href="/vendor/billboard/billboard.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Page-specific: center the single summary card. */
    .summary-card { max-width: 420px; margin: 8vh auto 0; text-align: center; }
    .summary-card .card-body { padding: 40px 24px; }
    .summary-label {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .summary-number {
      margin-top: 0.5rem;
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      color: var(--text-dark);
    }
    .summary-error {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-brand">CometTrail</div>
      </div>
    </header>

    <main class="main-content">
      <div class="card summary-card">
        <div class="card-body">
          <div class="summary-label">Total requests captured</div>
          <div class="summary-number" id="total">…</div>
        </div>
      </div>
    </main>
  </div>

  <!-- billboard.js charting library (d3 bundled). Loaded and available as the
       global `bb` for charts wired into the dashboard later. -->
  <script src="/vendor/billboard/billboard.pkgd.min.js"></script>

  <script type="module">
    const el = document.getElementById('total');
    try {
      const res = await fetch('/api/summary');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { total } = await res.json();
      el.textContent = total.toLocaleString();
    } catch (err) {
      el.classList.add('summary-error');
      el.textContent = `Failed to load: ${err.message}`;
    }
  </script>
</body>
</html>
