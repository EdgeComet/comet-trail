<!doctype html>
<!-- data-theme="dark" opts into the dark palette; remove it for the light theme. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CometTrail</title>
  <link rel="stylesheet" href="/vendor/billboard/billboard.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-content">
        <div class="header-brand">CometTrail</div>
        <div class="header-actions">
          <button class="theme-toggle" id="theme-toggle" type="button"
                  aria-label="Toggle light and dark theme">
            <!-- sun (shown in dark mode → click for light) -->
            <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <!-- moon (shown in light mode → click for dark) -->
            <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <a class="nav-item" href="/log-analyzer" data-route>Log Analyzer</a>
          <a class="nav-item" href="/indexation" data-route>Indexation</a>
          <a class="nav-item" href="/content" data-route>Content</a>
        </nav>
      </aside>

      <!-- Router outlet: js/main.js paints the active page view in here. -->
      <main class="main-content" id="view-outlet"></main>
    </div>
  </div>

  <!-- billboard.js charting library (d3 bundled). Loaded and available as the
       global `bb` for charts wired into the dashboard later. -->
  <script src="/vendor/billboard/billboard.pkgd.min.js"></script>

  <!-- Provider/Chart framework entry point. -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
